name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: App script parses
        run: |
          node -e "const s=require('fs').readFileSync('index.html','utf8');const m=s.match(/<script>([\s\S]*?)<\/script>\s*<\/body>/);if(!m)throw new Error('inline script not found');new Function(m[1]);console.log('inline script OK')"

      - name: Version files agree
        run: |
          v=$(cat VERSION)
          grep -q "Inkboard v$v" index.html || { echo "index.html version does not match VERSION ($v)"; exit 1; }
          grep -q "org.opencontainers.image.version=\"$v\"" Dockerfile || { echo "Dockerfile version does not match VERSION ($v)"; exit 1; }
          grep -q "^## \[$v\]" CHANGELOG.md || { echo "CHANGELOG.md has no entry for $v"; exit 1; }

      - name: Shell lint
        run: shellcheck start.sh

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t inkboard:ci .

      - name: Run and check it serves the app
        run: |
          docker run -d --name inkboard-ci -p 8080:80 inkboard:ci
          for i in $(seq 1 20); do curl -fsS -o /dev/null http://localhost:8080/ && break; sleep 1; done
          curl -fsS http://localhost:8080/ | grep -q "Inkboard"
          curl -fsS -o /dev/null http://localhost:8080/vendor/pdfjs/pdf.min.js
          curl -fsS -o /dev/null http://localhost:8080/vendor/pdfjs/pdf.worker.min.js

      - name: Container logs
        if: failure()
        run: docker logs inkboard-ci
